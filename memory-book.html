<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Our Little Book of Memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#D9B7B3; --bg-deep:#B58584; --on-bg:#3A1C29; --on-bg-soft:#6A4552; --bar:rgba(217,183,179,.86);
  --paper:#F7EAE2; --paper-edge:#E3CBBE; --ink:#2E2340; --ink-soft:#6B5866; --rule:rgba(46,35,64,.16);
  --leather:#4A1421; --gold:#C9A14E; --gold-soft:rgba(201,161,78,.55);
  --seal:#8C1C2E; --seal-light:#B8404F; --sage:#7D8A6B;
  --serif:"IM Fell English","Iowan Old Style",Georgia,"Times New Roman",serif;
  --script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#2A0C15;--bg-deep:#13040A;--on-bg:#F2DFD7;--on-bg-soft:#CDAAA8;--bar:rgba(42,12,21,.86);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#2A0C15;--bg-deep:#13040A;--on-bg:#F2DFD7;--on-bg-soft:#CDAAA8;--bar:rgba(42,12,21,.86);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background-color:var(--bg);
  background-image:radial-gradient(ellipse at 50% 30%,transparent 35%,var(--bg-deep) 130%);background-attachment:fixed;
  color:var(--on-bg);font-family:var(--serif);font-size:18px;line-height:1.6;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.has-bar::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
main{flex:1;display:flex;flex-direction:column}
.view{display:none;flex:1;flex-direction:column;align-items:center}
.view.active{display:flex}

.btn{background:var(--seal);color:#F7EAE2;border:0;border-radius:6px;padding:11px 22px;font-size:17px;font-style:italic;cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,220,180,.35),0 10px 22px -12px rgba(60,5,20,.7);transition:background .2s}
.btn:hover{background:var(--seal-light)}
.btn:disabled{opacity:.6;cursor:default}
.ghost{background:transparent;border:1px solid currentColor;border-radius:6px;padding:9px 16px;font-size:15px;font-style:italic;cursor:pointer;opacity:.85}
.ghost:hover{opacity:1}
.link{background:none;border:0;padding:4px 2px;font-style:italic;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:inherit}

.paper{position:relative;background:var(--paper);color:var(--ink);border-radius:2px;
  box-shadow:0 1px 0 var(--paper-edge),0 30px 60px -28px rgba(30,5,12,.65),inset 0 0 80px rgba(150,96,70,.2)}

/* ---------- cover ---------- */
#cover{justify-content:center;gap:22px;padding:40px 18px 52px}
.book{position:relative;width:min(80vw,360px);aspect-ratio:3/4;perspective:1800px}
.plate{position:absolute;inset:0;border-radius:3px 8px 8px 3px;padding:30px 26px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.plate .orn{width:120px;margin:0 auto 4px;display:block;color:var(--gold)}
.plate .belongs{font-family:var(--script);font-size:clamp(30px,8vw,38px);line-height:1.1;margin:0}
.plate .owners{font-style:italic;font-size:21px;margin:2px 0 18px;color:var(--ink-soft)}
.plate label{display:block;text-align:left;font-style:italic;font-size:14px;color:var(--ink-soft);margin-top:6px}
.plate input{width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--ink-soft);padding:5px 2px;font-size:17px;color:var(--ink);margin-bottom:6px}
.plate input:focus{outline:none;border-bottom-color:var(--seal)}
.plate .btn{margin-top:14px;width:100%}
.plate .msg{min-height:1.4em;margin:10px 0 0;font-size:14px;font-style:italic;color:var(--seal)}
.plate .demo-note{font-size:14px;font-style:italic;color:var(--ink-soft);margin:0 0 6px}
.cover{position:absolute;inset:0;z-index:2;transform-origin:left center;transform-style:preserve-3d;
  transition:transform 1.3s cubic-bezier(.6,.05,.25,1),opacity .45s ease 1.05s}
.book.open .cover{transform:rotateY(-168deg);opacity:0;pointer-events:none}
.face{position:absolute;inset:0;border-radius:3px 10px 10px 3px;-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden}
.front{background-color:var(--leather);
  background-image:linear-gradient(to right,rgba(0,0,0,.45),rgba(0,0,0,0) 9%,rgba(255,255,255,.05) 10%,rgba(0,0,0,0) 12%),
    radial-gradient(circle at 30% 18%,rgba(255,255,255,.08),transparent 55%),
    radial-gradient(circle at 80% 92%,rgba(0,0,0,.4),transparent 60%),
    repeating-radial-gradient(circle at 40% 40%,rgba(0,0,0,.06) 0 1px,transparent 1px 3px);
  box-shadow:0 30px 50px -24px rgba(10,0,4,.8),inset 0 0 40px rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 34px 0 44px}
.front::before,.front::after{content:"";position:absolute;border-radius:4px;pointer-events:none}
.front::before{inset:16px 16px 16px 26px;border:1.5px solid var(--gold-soft)}
.front::after{inset:22px 22px 22px 32px;border:1px solid rgba(201,161,78,.3)}
.front .orn{width:110px;color:var(--gold);opacity:.9}
.front h1{font-family:var(--script);font-weight:400;color:#D8B56C;font-size:clamp(36px,10vw,50px);line-height:1.05;margin:10px 0;
  text-shadow:0 1px 0 rgba(0,0,0,.55),0 -1px 0 rgba(255,230,170,.2)}
.front .sub{font-style:italic;color:rgba(216,181,108,.8);font-size:16px;margin:0}
.back{transform:rotateY(180deg);
  background-color:#5E1A2A;
  background-image:radial-gradient(ellipse at 20% 30%,rgba(201,161,78,.25),transparent 40%),radial-gradient(ellipse at 70% 70%,rgba(184,64,79,.5),transparent 45%),
    radial-gradient(ellipse at 40% 85%,rgba(30,6,12,.6),transparent 40%),radial-gradient(ellipse at 85% 15%,rgba(247,234,226,.12),transparent 35%)}
.strap{position:absolute;right:-8px;top:50%;width:58px;height:70px;transform:translateY(-50%);border-radius:10px 0 0 10px;z-index:3;
  background:linear-gradient(to bottom,#3A0F1A,#2A0A12);box-shadow:-4px 6px 12px -4px rgba(0,0,0,.6)}
.seal{position:absolute;left:-26px;top:50%;width:62px;height:62px;transform:translateY(-50%);border:0;background:none;padding:0;cursor:pointer;border-radius:50%;
  animation:breathe 2.8s ease-in-out infinite}
.seal svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 4px rgba(20,0,6,.5))}
@keyframes breathe{50%{transform:translateY(-50%) scale(1.07)}}
.cover-hint{margin:0;font-style:italic;color:var(--on-bg-soft)}

/* ---------- app bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px max(16px,calc((100% - 720px)/2));background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar .home{background:none;border:0;padding:0;cursor:pointer;font-family:var(--script);font-size:clamp(24px,6.5vw,30px);line-height:1;color:var(--on-bg);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.bar .acts{display:flex;gap:8px;align-items:center;flex-shrink:0}
.bar button{white-space:nowrap}
.bar .ghost{padding:7px 10px;font-size:14px}
.bar .btn{padding:8px 12px;font-size:15px}
.demo-banner{width:min(94vw,680px);margin:14px 0 0;padding:10px 14px;border:1px dashed var(--on-bg-soft);border-radius:6px;font-size:14px;font-style:italic;color:var(--on-bg-soft);text-align:center}

/* ---------- contents ---------- */
#contents{padding:0 0 60px}
.otd{width:min(94vw,680px);margin:22px 0 0;padding:16px 20px;text-align:left;cursor:pointer;border:0;transform:rotate(-.6deg);display:flex;gap:14px;align-items:center}
.otd::before{content:"";position:absolute;top:-10px;left:40px;width:64px;height:20px;background:rgba(125,138,107,.55);transform:rotate(-4deg)}
.otd .when{font-family:var(--script);font-size:28px;line-height:1;margin:0}
.otd .what{margin:2px 0 0;font-style:italic;color:var(--ink-soft);font-size:16px}
.toc{width:min(94vw,680px);margin:26px 0 0;padding:clamp(26px,6vw,46px) clamp(18px,5vw,44px)}
.toc h2{font-family:var(--script);font-weight:400;font-size:clamp(44px,11vw,60px);line-height:1;margin:0 0 6px;text-align:center}
.toc .count{text-align:center;font-style:italic;color:var(--ink-soft);margin:0 0 10px;font-size:15px}
.chapter{margin-top:26px}
.chapter h3{font-family:var(--script);font-weight:400;font-size:clamp(30px,8vw,38px);line-height:1.1;margin:0;color:var(--seal)}
.chapter .n{font-style:italic;color:var(--ink-soft);font-size:14px;margin:0 0 6px}
.entry{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px dashed var(--rule);padding:12px 2px;cursor:pointer;color:var(--ink)}
.entry:last-child{border-bottom:0}
.thumb{width:62px;height:62px;background:#FBF6F1;padding:4px;box-shadow:0 6px 12px -6px rgba(30,5,12,.6);transform:rotate(var(--r,-3deg))}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.none{display:grid;place-items:center;background:#EFDDD2;color:var(--sage)}
.thumb.none svg{width:30px}
.entry .t{font-size:19px;line-height:1.25;display:block}
.entry .p{font-size:15px;font-style:italic;color:var(--ink-soft);display:block;margin-top:2px}
.entry .d{text-align:center;line-height:1}
.entry .d b{display:block;font-weight:400;font-size:26px}
.entry .d i{font-size:13px;color:var(--ink-soft)}
.empty{text-align:center;padding:20px 0 6px}
.empty p{font-style:italic;color:var(--ink-soft);margin:0 0 16px}

/* ---------- memory page ---------- */
#memory{padding:0 0 60px}
.page{width:min(94vw,680px);margin:26px 0 0;padding:clamp(30px,7vw,54px) clamp(22px,6vw,50px) clamp(26px,6vw,40px);
  touch-action:pan-y;transition:transform .35s ease,opacity .35s ease}
.page.out-l{transform:translateX(-40px) rotate(-1deg);opacity:0}
.page.out-r{transform:translateX(40px) rotate(1deg);opacity:0}
.page .date{font-style:italic;color:var(--ink-soft);margin:0;font-size:16px}
.page h2{font-family:var(--script);font-weight:400;font-size:clamp(42px,11vw,60px);line-height:1.05;margin:4px 0 0;padding-right:84px}
.stamp{position:absolute;top:26px;right:22px;width:92px;height:92px;border-radius:50%;border:2px solid var(--seal);color:var(--seal);opacity:.72;
  display:grid;place-items:center;text-align:center;transform:rotate(12deg);font-size:12.5px;line-height:1.15;padding:10px;font-style:italic}
.stamp::before{content:"";position:absolute;inset:4px;border-radius:50%;border:1px dashed var(--seal)}
.collage{display:flex;flex-direction:column;gap:24px;margin:26px 0 8px;min-height:120px}
.crow{display:flex;gap:16px;align-items:flex-start;justify-content:center}
.snap{position:relative;background:#FBF6F1;padding:8px 8px 22px;box-shadow:0 14px 26px -16px rgba(30,5,12,.75),0 1px 2px rgba(30,5,12,.18);
  transform:rotate(var(--r));border:0;cursor:zoom-in;display:block;min-width:0}
.snap img{width:100%;aspect-ratio:var(--ar,4/5);object-fit:cover;display:block;background:#EFDDD2}
.snap::before{content:"";position:absolute;top:-11px;left:50%;width:68px;height:22px;transform:translateX(-50%) rotate(var(--tr));background:var(--tape);z-index:1}
.note{margin-top:22px}
.note p{margin:0 0 1em;font-size:19px;line-height:1.8}
.sign{font-family:var(--script);font-size:30px;margin:10px 0 0;text-align:right;color:var(--ink-soft)}
.pager{width:min(94vw,680px);display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.pager .mid{display:flex;gap:8px}

/* ---------- lightbox ---------- */
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(15,3,8,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 12px calc(env(safe-area-inset-bottom,0px) + 16px);touch-action:pan-y}
.lightbox img{max-width:94vw;max-height:76vh;object-fit:contain;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.lightbox .row{display:flex;gap:10px;align-items:center;color:#F2DFD7}
.lightbox .ghost{color:#F2DFD7}
.lightbox .c{font-style:italic;font-size:15px;min-width:64px;text-align:center}

/* ---------- editor ---------- */
.editor-wrap{position:fixed;inset:0;z-index:50;overflow-y:auto;background:rgba(20,4,10,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  padding:calc(env(safe-area-inset-top,0px) + 20px) 0 calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;justify-content:center;align-items:flex-start}
.editor{width:min(94vw,640px);padding:clamp(28px,6vw,46px) clamp(20px,6vw,44px)}
.editor h2{font-family:var(--script);font-weight:400;font-size:clamp(40px,10vw,54px);line-height:1;margin:0 0 14px}
.field{margin-top:16px}
.field label{display:block;font-style:italic;font-size:15px;color:var(--ink-soft)}
.field input[type=text],.field input[type=date]{width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--ink-soft);padding:6px 2px;font-size:19px;color:var(--ink)}
.field input:focus,.field textarea:focus{outline:none;border-bottom-color:var(--seal)}
.field textarea{width:100%;min-height:224px;resize:vertical;background:transparent;border:0;border-bottom:1.5px solid var(--ink-soft);color:var(--ink);
  font-size:19px;line-height:32px;padding:0 2px;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-attachment:local}
.field .hint{font-size:14px;font-style:italic;color:var(--ink-soft);margin:6px 0 0}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;margin-top:10px}
.ph{position:relative;background:#FBF6F1;padding:5px 5px 30px;box-shadow:0 8px 14px -8px rgba(30,5,12,.6)}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.ph button{position:absolute;left:0;right:0;bottom:4px;background:none;border:0;font-size:13px;font-style:italic;color:var(--seal);cursor:pointer;text-decoration:underline}
.add-photo{position:relative;display:grid;place-items:center;align-content:center;aspect-ratio:1/1.25;border:1.5px dashed var(--ink-soft);border-radius:4px;color:var(--ink-soft);font-style:italic;font-size:15px;cursor:pointer;text-align:center;padding:8px}
.add-photo input{position:absolute;width:1px;height:1px;opacity:0}
.ed-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:26px}
.ed-actions .r{display:flex;gap:10px}
.ed-msg{min-height:1.4em;margin:12px 0 0;font-style:italic;color:var(--seal);font-size:15px}

/* ---------- sealed ---------- */
.sealed{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none}
.sealed div{text-align:center;animation:stampIn .5s cubic-bezier(.3,1.4,.5,1) both}
.sealed svg{width:150px;height:150px;filter:drop-shadow(0 10px 14px rgba(20,0,6,.55))}
.sealed p{font-family:var(--script);font-size:44px;margin:4px 0 0;color:#F2DFD7;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.sealed.bye{animation:fadeOut .6s ease forwards}
@keyframes stampIn{0%{transform:scale(2.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fadeOut{to{opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.15s!important;transition-delay:0s!important}
}

/* ---------- v2: navigation ---------- */
body.has-turn main{padding-bottom:84px}
.turnbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px max(16px,calc((100% - 720px)/2)) calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 -10px 24px -18px rgba(0,0,0,.6)}
.turnbar .pos{font-style:italic;font-size:15px;color:var(--on-bg-soft);text-align:center}
.turnbar .ghost{padding:8px 16px;min-width:92px}
.ghost:disabled{opacity:.28;cursor:default}
.date .edit-inline{margin-left:10px;font-size:15px;color:var(--seal);padding:0}
.collage .loading{font-style:italic;color:var(--ink-soft);text-align:center;font-size:15px;padding:40px 0;margin:0}
.slip{width:min(94vw,680px);margin:22px 0 0;padding:14px 20px;text-align:left;cursor:pointer;border:0;transform:rotate(.5deg);display:flex;gap:14px;align-items:center}
.slip::before{content:"";position:absolute;top:-10px;right:46px;width:64px;height:20px;background:rgba(222,158,162,.62);transform:rotate(5deg)}
.slip .when{font-family:var(--script);font-size:26px;line-height:1;margin:0}
.slip .what{margin:2px 0 0;font-style:italic;color:var(--ink-soft);font-size:16px}
.loading-book{font-style:italic;color:var(--on-bg-soft);margin:60px 0}

/* ---------- dedication ---------- */
#dedication{justify-content:center;padding:40px 18px 52px;gap:22px}
.dedi{width:min(92vw,560px);padding:clamp(38px,9vw,64px) clamp(26px,8vw,60px);text-align:left}
.dedi .orn{width:120px;display:block;margin:0 auto 18px;color:var(--gold)}
.dedi h2{font-family:var(--script);font-weight:400;font-size:clamp(46px,12vw,62px);line-height:1;margin:0 0 20px}
.dedi p{font-size:19px;line-height:1.8;margin:0 0 1em}
.dedi .sig{font-family:var(--script);font-size:clamp(34px,9vw,44px);text-align:right;margin:18px 0 0;color:var(--ink-soft)}
.toc-foot{margin-top:22px;display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
/* ---------- seen + hearts ---------- */
.page-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px;flex-wrap:wrap}
.page-foot .sign{margin:0}
.react{display:flex;flex-direction:column;gap:6px}
.heart{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:7px 16px;font-size:15px;font-style:italic;cursor:pointer;color:var(--ink-soft);display:inline-flex;gap:7px;align-items:center;align-self:flex-start;transition:background .2s,color .2s,transform .15s}
.heart:active{transform:scale(.96)}
.heart .h{font-style:normal;font-size:16px;line-height:1}
.heart[aria-pressed="true"]{background:var(--seal);color:#F7EAE2;border-color:var(--seal)}
.react-text{font-style:italic;font-size:14px;color:var(--ink-soft);margin:0;min-height:1.2em}
.seen{font-style:italic;font-size:14px;color:var(--ink-soft);text-align:right;margin:8px 0 0}
.tag-new{display:inline-block;margin-left:8px;font-size:11px;font-style:normal;background:var(--seal);color:#F7EAE2;border-radius:999px;padding:1px 8px;vertical-align:2px;letter-spacing:.02em}
.hm{color:var(--seal);font-size:13px;margin-left:6px;font-style:normal}
/* ---------- favorites ---------- */
.ribbon{position:absolute;top:-4px;left:14px;width:24px;height:42px;border:0;padding:0;background:none;cursor:pointer;filter:drop-shadow(0 3px 3px rgba(60,5,20,.35));transition:transform .2s}
.ribbon span{display:block;width:100%;height:100%;background:rgba(140,28,46,.2);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);transition:background .25s}
.ribbon:hover{transform:translateY(3px)}
.ribbon[aria-pressed="true"] span{background:var(--seal)}
.page .date{padding-left:28px}
.fav-note{font-style:italic;font-size:14px;color:var(--seal);margin:4px 0 0;min-height:1.2em}
.entry.is-fav .t::after{content:"";display:inline-block;width:8px;height:12px;margin-left:7px;vertical-align:-1px;background:var(--seal);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
/* ---------- v2: contents tools ---------- */

/* ---------- wax seal ---------- */
function sealSVG(id){
  const n = 16, pts = [];
  for (let i = 0; i < n; i++){
    const a = i / n * Math.PI * 2, r = 45 + (i % 2 ? 3 : -1.5) + Math.sin(i * 2.7) * 1.6;
    pts.push([50 + r * Math.cos(a), 50 + r * Math.sin(a)]);
  }
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  const m0 = mid(pts[n - 1], pts[0]);
  let d = `M${m0[0].toFixed(1)},${m0[1].toFixed(1)}`;
  for (let i = 0; i < n; i++){ const p = pts[i], q = mid(p, pts[(i + 1) % n]); d += ` Q${p[0].toFixed(1)},${p[1].toFixed(1)} ${q[0].toFixed(1)},${q[1].toFixed(1)}`; }
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="${id}" cx="36%" cy="30%" r="78%">
    <stop offset="0" stop-color="#BE4757"/><stop offset=".55" stop-color="#8C1C2E"/><stop offset="1" stop-color="#550C19"/></radialGradient></defs>
    <path d="${d}" fill="url(#${id})"/><circle cx="50" cy="50" r="30" fill="none" stroke="#550C19" stroke-width="2.5" opacity=".7"/>
    <path d="M50 66s-15-9.2-15-19.8A8.3 8.3 0 0 1 50 40.4a8.3 8.3 0 0 1 15 5.8C65 56.8 50 66 50 66z" fill="#550C19" opacity=".9"/>
    <path d="M49 65s-15-9.2-15-19.8A8.3 8.3 0 0 1 49 39.4" fill="none" stroke="#F3B3B3" stroke-width=".8" opacity=".35"/></svg>`;
}
const flower = '<svg viewBox="0 0 40 40" aria-hidden="true"><g fill="currentColor"><circle cx="20" cy="11" r="6"/><circle cx="29" cy="18" r="6"/><circle cx="25" cy="28" r="6"/><circle cx="15" cy="28" r="6"/><circle cx="11" cy="18" r="6"/></g><circle cx="20" cy="20" r="4" fill="#EFDDD2"/></svg>';

/* ---------- sample artwork (preview only) ---------- */
function art(kind){
  const svgs = {

    city: `<rect width="400" height="500" fill="#1C1430"/><g opacity=".75"><circle cx="70" cy="120" r="34" fill="#C9A14E" opacity=".5"/><circle cx="300" cy="90" r="44" fill="#B8404F" opacity=".45"/><circle cx="210" cy="230" r="28" fill="#F3C98B" opacity=".55"/><circle cx="110" cy="320" r="52" fill="#8C1C2E" opacity=".5"/><circle cx="320" cy="300" r="30" fill="#E9A9A6" opacity=".5"/><circle cx="240" cy="420" r="40" fill="#C9A14E" opacity=".35"/></g><path d="M0 500V380h40v-60h30v80h40v-120h50v140h30v-90h60v110h40v-70h50v120h60v-40z" fill="#0D0817"/>`,

    this.data.push(rec); return rec;
  },
  async remove(id){ this.data = this.data.filter(m => m.id !== id); },

/* ---------- data: Supabase store ---------- */
const sb = (DEMO || LIB_MISSING) ? null : window.supabase.createClient(SUPABASE.url, SUPABASE.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
const names = {};
const BUCKET = 'memories';
const urlCache = {};
const urlFor = path => (urlCache[path] && urlCache[path].exp > Date.now()) ? urlCache[path].url : null;
async function signPaths(paths){
  const need = [...new Set(paths)].filter(p => { const c = urlCache[p]; return !c || c.exp < Date.now() + 10 * 60 * 1000; });
  for (let i = 0; i < need.length; i += 100){
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(need.slice(i, i + 100), 60 * 60 * 12);
    if (error) throw error;
    (data || []).forEach(d => { if (d.signedUrl) urlCache[d.path] = { url: d.signedUrl, exp: Date.now() + 11.5 * 60 * 60 * 1000 }; });
  }
}
const SupaStore = {
  async session(){ const { data } = await sb.auth.getSession(); return data.session ? data.session.user : null; },
  async signIn(email, password){
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    return data.user;
  },
  async signOut(){ await sb.auth.signOut(); },
  async list(){
    const [mem, mb, pv, ph] = await Promise.all([
      sb.from('memories').select('id,date,title,place,note,favorite,author_id,created_at,memory_photos(id,path,position)').order('date', { ascending: false }),
      sb.from('members').select('user_id,display_name'),
      sb.from('page_views').select('memory_id,user_id,first_seen'),
      sb.from('page_hearts').select('memory_id,user_id')
    ]);
    if (mem.error) throw mem.error;
    social = !pv.error && !ph.error;
    const viewsBy = {}, heartsBy = {};
    (pv.data || []).forEach(v => (viewsBy[v.memory_id] = viewsBy[v.memory_id] || []).push(v));
    (ph.data || []).forEach(h => (heartsBy[h.memory_id] = heartsBy[h.memory_id] || []).push(h.user_id));
    (mb.data || []).forEach(m => names[m.user_id] = m.display_name);
    const rows = mem.data.map(m => ({
      id: m.id, date: m.date, title: m.title, place: m.place || '', note: m.note || '',
      author: names[m.author_id] || '', authorId: m.author_id, created: m.created_at, favorite: !!m.favorite,
      views: viewsBy[m.id] || [], hearts: heartsBy[m.id] || [],
      photos: (m.memory_photos || []).sort((a, b) => a.position - b.position).map(p => ({ id: p.id, path: p.path, url: null }))
    }));
    await signPaths(rows.filter(m => m.photos.length).map(m => m.photos[0].path));   // covers only
    rows.forEach(m => m.photos.forEach(p => p.url = urlFor(p.path)));
    return rows;
  },
  async ensureUrls(m){
    await signPaths(m.photos.map(p => p.path));
    m.photos.forEach(p => p.url = urlFor(p.path));
  },
  async save(m, keep, blobs, onProgress){
    let id = m.id;
    const row = { date: m.date, title: m.title, place: m.place || null, note: m.note || null };
    if (id){
      const { error } = await sb.from('memories').update(row).eq('id', id);
      if (error) throw error;
    } else {
      const { data, error } = await sb.from('memories').insert(row).select('id').single();
      if (error) throw error;
      id = data.id;
    }
    const { data: existing, error: exErr } = await sb.from('memory_photos').select('id,path').eq('memory_id', id);
    if (exErr) throw exErr;
    const keepIds = new Set(keep.map(p => p.id));
    const gone = (existing || []).filter(p => !keepIds.has(p.id));
    if (gone.length){
      await sb.storage.from(BUCKET).remove(gone.map(p => p.path));
      const { error } = await sb.from('memory_photos').delete().in('id', gone.map(p => p.id));
      if (error) throw error;
    }
    for (let i = 0; i < keep.length; i++){
      const { error } = await sb.from('memory_photos').update({ position: i }).eq('id', keep[i].id);
      if (error) throw error;
    }
    for (let j = 0; j < blobs.length; j++){
      if (onProgress) onProgress(j + 1, blobs.length);
      const path = `${id}/${Date.now()}-${j}-${Math.random().toString(36).slice(2, 8)}.jpg`;
      const up = await sb.storage.from(BUCKET).upload(path, blobs[j], { contentType: 'image/jpeg', upsert: false });
      if (up.error) throw up.error;
      const ins = await sb.from('memory_photos').insert({ memory_id: id, path, position: keep.length + j });
      if (ins.error) throw ins.error;
    }
    return { id };
  },
  async recordView(id){
    const { error } = await sb.from('page_views').upsert({ memory_id: id, user_id: me, last_seen: new Date().toISOString() }, { onConflict: 'memory_id,user_id' });
    if (error) throw error;
  },
  async setHeart(id, on){
    const q = on ? sb.from('page_hearts').insert({ memory_id: id, user_id: me })
                 : sb.from('page_hearts').delete().eq('memory_id', id).eq('user_id', me);
    const { error } = await q;
    if (error) throw error;
  },
  async setFavorite(id, val){
    const { error } = await sb.from('memories').update({ favorite: val }).eq('id', id);
    if (error) throw error;
  },
  async remove(id){
    const { data } = await sb.from('memory_photos').select('path').eq('memory_id', id);
    if (data && data.length) await sb.storage.from(BUCKET).remove(data.map(p => p.path));
    const { error } = await sb.from('memories').delete().eq('id', id);
    if (error) throw error;
  }
};

/* ---------- photo compression ---------- */
async function compress(file, max = 1600, q = .82){
  let src, w, h;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); w = src.width; h = src.height; }
  catch {
    src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', q));
}

  if (userIn){
    const rb = el('button', 'ribbon'); rb.append(el('span'));
    const setRb = () => { rb.setAttribute('aria-pressed', String(!!m.favorite)); rb.setAttribute('aria-label', m.favorite ? 'Remove from favorites' : 'Add to favorites'); rb.title = rb.getAttribute('aria-label'); };
    setRb();
    rb.addEventListener('click', async () => {
      const val = !m.favorite; m.favorite = val; setRb();
      const live = memories.find(x => x.id === m.id); if (live) live.favorite = val;
      $('#favNote').textContent = val ? 'Added to favorites' : 'Removed from favorites';
      try { await Store.setFavorite(m.id, val); }
      catch (err){ console.error(err); m.favorite = !val; if (live) live.favorite = !val; setRb(); $('#favNote').textContent = 'This couldn\u2019t be saved. Try again.'; }
    });
    p.append(rb);
  }
  const dl = el('p', 'date', longDate(m.date));
  if (userIn){ const e = el('button', 'link edit-inline', 'Edit'); e.addEventListener('click', () => openEditor(m)); dl.append(e); }
  p.append(dl);
  p.append(el('h2', null, m.title));
  const fn = el('p', 'fav-note'); fn.id = 'favNote'; fn.setAttribute('aria-live', 'polite'); p.append(fn);
  if (m.place){ const s = el('div', 'stamp', m.place); s.setAttribute('aria-label', 'Place: ' + m.place); p.append(s); }
  if (m.photos.length){
    const c = el('div', 'collage'); c.append(el('p', 'loading', 'Loading photos\u2026')); p.append(c);
    layoutCollage(c, m);
  }
  if (m.note){
    const n = el('div', 'note');
    m.note.split(/\n\s*\n/).forEach(par => n.append(el('p', null, par.trim())));
    p.append(n);
  }
  const foot = el('div', 'page-foot');
  const react = el('div', 'react');
  if (userIn && social){
    const hb = el('button', 'heart'); hb.type = 'button';
    const rt = el('p', 'react-text'); rt.setAttribute('aria-live', 'polite');
    const paint = () => {
      const mine = m.hearts.includes(me), others = m.hearts.filter(u => u !== me).map(u => names[u] || 'Someone');
      hb.setAttribute('aria-pressed', String(mine));
      hb.innerHTML = ''; hb.append(el('span', 'h', mine ? '\u2665' : '\u2661'), el('span', null, mine ? 'Loved' : 'Love this'));
      rt.textContent = mine && others.length ? 'You both loved this' : mine ? 'You loved this' : others.length ? `${others.join(' and ')} loved this` : '';
    };
    paint();
    hb.addEventListener('click', async () => {
      const on = !m.hearts.includes(me);
      m.hearts = m.hearts.filter(u => u !== me); if (on) m.hearts.push(me);
      const live = memories.find(x => x.id === m.id); if (live) live.hearts = m.hearts;
      paint();
      try { await Store.setHeart(m.id, on); }
      catch (err){ console.error(err); m.hearts = m.hearts.filter(u => u !== me); if (!on) m.hearts.push(me); if (live) live.hearts = m.hearts; paint(); rt.textContent = 'This couldn\u2019t be saved. Try again.'; }
    });
    react.append(hb, rt);
  }
  foot.append(react, el('p', 'sign', 'Written by ' + (m.author || 'Carl')));
  p.append(foot);
  if (userIn && social && me){
    const others = Object.keys(names).filter(id => id !== me && id !== m.authorId);
    if (others.length){
      const parts = others.map(id => { const v = (m.views || []).find(x => x.user_id === id);
        return v ? `Seen by ${names[id]} on ${shortDate(v.first_seen)}` : `Not seen by ${names[id]} yet`; });
      p.append(el('p', 'seen', parts.join('. ')));
    }
    if (!(m.views || []).some(v => v.user_id === me)){
      m.views = [...(m.views || []), { user_id: me, first_seen: new Date().toISOString() }];
      const live = memories.find(x => x.id === m.id); if (live) live.views = m.views;
      Store.recordView(m.id).catch(err => console.error(err));
    }
  }
  const N = list.length;
  $('#pagePos').textContent = `Page ${N - idx} of ${N}`;
  $('#olderBtn').disabled = idx >= N - 1;
  $('#newerBtn').disabled = idx <= 0;
  return true;
}
const ratioCache = {};
function photoRatio(url){
  if (ratioCache[url]) return Promise.resolve(ratioCache[url]);
  return new Promise(res => {
    const im = new Image(); let done = false;
    const fin = r => { if (done) return; done = true; ratioCache[url] = r; res(r); };
    im.onload = () => fin(im.naturalWidth && im.naturalHeight ? im.naturalWidth / im.naturalHeight : 0.8);
    im.onerror = () => fin(0.8);
    setTimeout(() => fin(0.8), 8000);
    im.src = url;
  });
}
async function layoutCollage(c, m){
  try { await Store.ensureUrls(m); } catch (err){ console.error(err); }
  const photos = m.photos.filter(p => p.url);
  const ratios = await Promise.all(photos.map(ph => photoRatio(ph.url)));
  if (!current || current.id !== m.id || !c.isConnected) return;
  c.innerHTML = '';
  if (!photos.length){ c.append(el('p', 'loading', 'Photos couldn\u2019t load. Check your connection and reopen this page.')); return; }
  const clamp = r => Math.min(1.9, Math.max(0.62, r));
  const n = photos.length, rows = [];
  let k = 0;
  if (n % 2 === 1){ rows.push([0]); k = 1; }
  for (; k < n; k += 2) rows.push([k, k + 1].filter(x => x < n));
  rows.forEach(row => {
    const r = el('div', 'crow');
    row.forEach(i => {
      const ph = photos[i], ar = clamp(ratios[i]);
      const b = el('button', 'snap');
      b.style.flex = `${ar.toFixed(3)} 1 0%`;
      b.style.setProperty('--ar', ar.toFixed(3));
      b.style.setProperty('--r', ((i % 2 ? 1 : -1) * (ar > 1.2 ? rand(.5, 1.3) : rand(1, 2.6))).toFixed(1) + 'deg');
      b.style.setProperty('--tr', rand(-8, 8).toFixed(1) + 'deg');
      b.style.setProperty('--tape', i % 2 ? 'rgba(222,158,162,.62)' : 'rgba(125,138,107,.55)');
      if (row.length === 1) b.style.maxWidth = ar >= 1 ? '100%' : Math.round(440 * ar) + 'px';
      b.setAttribute('aria-label', `Open photo ${i + 1} of ${n}`);
      const img = el('img'); img.src = ph.url; img.alt = ''; img.decoding = 'async'; b.append(img);
      b.addEventListener('click', () => openLightbox(photos, i));
      r.append(b);
    });
    c.append(r);
  });
}
async function turn(dir){
  const list = sorted(); const idx = list.findIndex(m => m.id === current.id);
  const next = list[idx + dir]; if (!next) return;
  const p = $('#page');
  if (!reduce){ p.classList.add(dir > 0 ? 'out-l' : 'out-r'); await wait(260); }
  go('memory', next.id);
  if (!reduce){
    p.classList.add(dir > 0 ? 'out-r' : 'out-l');
    requestAnimationFrame(() => requestAnimationFrame(() => p.classList.remove('out-l', 'out-r')));
  }
}
$('#olderBtn').addEventListener('click', () => turn(1));
$('#newerBtn').addEventListener('click', () => turn(-1));
(() => {
  let sx = 0, sy = 0, on = false;
  const p = $('#page');
  p.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') return; on = true; sx = e.clientX; sy = e.clientY; });
  p.addEventListener('pointerup', e => {
    if (!on) return; on = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) turn(dx < 0 ? 1 : -1);
  });
  p.addEventListener('pointercancel', () => on = false);
})();

/* ---------- lightbox ---------- */
let lb = { list: [], i: 0 };
function showLb(){ $('#lbImg').src = lb.list[lb.i].url; $('#lbCount').textContent = `${lb.i + 1} of ${lb.list.length}`;
  $('#lbPrev').style.visibility = lb.list.length > 1 ? '' : 'hidden'; $('#lbNext').style.visibility = lb.list.length > 1 ? '' : 'hidden'; }
function openLightbox(list, i){ lb = { list, i }; showLb(); $('#lightbox').hidden = false; H.push({ overlay: 'lb' }); $('#lbClose').focus(); }
function closeLightbox(back = true){ $('#lightbox').hidden = true; if (back) H.back(); }
const lbStep = d => { lb.i = (lb.i + d + lb.list.length) % lb.list.length; showLb(); };
$('#lbPrev').addEventListener('click', () => lbStep(-1));
$('#lbNext').addEventListener('click', () => lbStep(1));
$('#lbClose').addEventListener('click', () => closeLightbox());
$('#lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLightbox(); });
(() => {
  let sx = 0; const box = $('#lightbox');
  box.addEventListener('pointerdown', e => sx = e.clientX);
  box.addEventListener('pointerup', e => { const dx = e.clientX - sx; if (Math.abs(dx) > 60) lbStep(dx < 0 ? 1 : -1); });
})();
document.addEventListener('keydown', e => {
  if (!$('#lightbox').hidden){
    if (e.key === 'Escape') closeLightbox(); if (e.key === 'ArrowRight') lbStep(1); if (e.key === 'ArrowLeft') lbStep(-1);
  } else if (!$('#editorWrap').hidden){ if (e.key === 'Escape') closeEditor(); }
  else if ($('#memory').classList.contains('active') && !/input|textarea/i.test(document.activeElement.tagName)){
    if (e.key === 'ArrowRight') turn(1); if (e.key === 'ArrowLeft') turn(-1);
  }
});

/* ---------- editor ---------- */
let ed = { id: null, keep: [], add: [] };
function renderPhotos_ed(){
  const box = $('#fPhotos'); box.innerHTML = '';
  const all = [...ed.keep.map(p => ({ url: p.url, kind: 'keep', ref: p })), ...ed.add.map(a => ({ url: a.url, kind: 'add', ref: a }))];
  all.forEach((p, i) => {
    const f = el('div', 'ph'); const img = el('img'); img.src = p.url; img.alt = ''; f.append(img);
    const r = el('button', null, i === 0 ? 'Remove (cover)' : 'Remove'); r.type = 'button';
    r.addEventListener('click', () => {
      if (p.kind === 'keep') ed.keep = ed.keep.filter(x => x !== p.ref);
      else { URL.revokeObjectURL(p.ref.url); ed.add = ed.add.filter(x => x !== p.ref); }
      renderPhotos_ed();
    });
    f.append(r); box.append(f);
  });
  const lab = el('label', 'add-photo'); lab.append(el('span', null, all.length ? 'Add more photos' : 'Add photos'));
  const inp = el('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true; lab.append(inp);
  inp.addEventListener('change', async () => {
    const files = [...inp.files]; if (!files.length) return;
    let bad = 0;
    for (let i = 0; i < files.length; i++){
      $('#edMsg').textContent = `Preparing photo ${i + 1} of ${files.length}\u2026`;
      try { const blob = await compress(files[i]); ed.add.push({ blob, url: URL.createObjectURL(blob) }); }
      catch { bad++; }
    }
    $('#edMsg').textContent = bad ? `${plural(bad, 'photo', 'photos')} couldn\u2019t be read. Try JPG or PNG.` : '';
    renderPhotos_ed();
  });
  box.append(lab);
}
async function openEditor(m){
  if (m){ try { await Store.ensureUrls(m); } catch {} }
  ed = { id: m ? m.id : null, keep: m ? m.photos.filter(p => p.url) : [], add: [] };
  $('#edTitle').textContent = m ? 'Edit this page' : 'A new page';
  $('#fDate').value = m ? m.date : todayISO();
  $('#fTitle').value = m ? m.title : '';
  $('#fPlace').value = m ? (m.place || '') : '';
  $('#fNote').value = m ? (m.note || '') : '';
  $('#saveBtn').textContent = m ? 'Save changes' : 'Seal this page';
  $('#delBtn').hidden = !m; $('#delBtn').textContent = 'Delete this page'; delete $('#delBtn').dataset.armed;
  $('#edMsg').textContent = '';
  renderPhotos_ed();
  $('#editorWrap').hidden = false; $('#editorWrap').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  H.push({ overlay: 'ed' });
  setTimeout(() => $('#fTitle').focus({ preventScroll: true }), 50);
}
function closeEditor(back = true){
  $('#editorWrap').hidden = true; document.body.style.overflow = '';
  if (back) H.back();
}
$('#cancelBtn').addEventListener('click', () => closeEditor());
const doSave = async e => {
  if (e) e.preventDefault();
  const btn = $('#saveBtn'); if (btn.disabled) return;
  const date = $('#fDate').value, title = $('#fTitle').value.trim();
  if (!date){ $('#edMsg').textContent = 'Pick a date for this page.'; $('#fDate').focus(); return; }
  if (!title){ $('#edMsg').textContent = 'Add a title for this page.'; $('#fTitle').focus(); return; }
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Saving\u2026'; $('#edMsg').textContent = '';
  try {
    const rec = await Store.save({ id: ed.id, date, title, place: $('#fPlace').value.trim(), note: $('#fNote').value.trim() },
      ed.keep, ed.add.map(a => a.blob), (i, n) => { btn.textContent = `Uploading ${i} of ${n}\u2026`; });
    btn.textContent = 'Saving\u2026';
    await loadMemories();
    closeEditor(false);
    await sealedMoment(label === 'Save changes' ? 'Saved' : 'Sealed');
    H.back();
    setTimeout(() => go('memory', rec.id), 30);
  } catch (err){
    console.error(err);
    $('#edMsg').textContent = 'This page couldn\u2019t be saved. Check your connection and try again.';
  } finally { btn.disabled = false; btn.textContent = label; }
};
$('#editor').addEventListener('submit', doSave);
$('#saveBtn').addEventListener('click', doSave);
$('#delBtn').addEventListener('click', async () => {
  const b = $('#delBtn');
  if (!b.dataset.armed){
    b.dataset.armed = '1'; b.textContent = 'Tap again to delete';
    setTimeout(() => { delete b.dataset.armed; b.textContent = 'Delete this page'; }, 4000);
    return;
  }
  delete b.dataset.armed; b.textContent = 'Deleting\u2026';
  try {
    await Store.remove(ed.id);
    await loadMemories();
    closeEditor(false); H.back();
    setTimeout(() => go('contents'), 30);
  } catch (err){ console.error(err); $('#edMsg').textContent = 'This page couldn\u2019t be deleted. Try again.'; b.textContent = 'Delete this page'; }
});
async function sealedMoment(word){
  const s = el('div', 'sealed'); const inner = el('div'); inner.innerHTML = sealSVG('s-done'); inner.append(el('p', null, word));
  s.append(inner); document.body.append(s);
  await wait(reduce ? 300 : 1100);
  s.classList.add('bye'); await wait(500); s.remove();
}

/* ---------- start ---------- */
H.replace({ view: 'cover' });
if (LIB_MISSING){ $('#loginMsg').textContent = 'The book couldn\u2019t load. Check your connection, then refresh the page.'; $('#loginBtn').disabled = true; }
(async () => {
  if (LIB_MISSING) return;
  try {
    const u = await Store.session();
    if (u){
      me = u.id; userIn = true; await loadMemories();
      $('#coverHint').textContent = 'Tap the seal to open your book';
    }
  } catch (err){ console.error(err); }
})();
</script>
